schemaVersion: 1
automationVersion: 0.3.0
suiteName: QualityStream 전체 절차
purpose: 대화 기억 없이 이 파일과 연결된 원본만으로 장기간 뒤에도 같은 테스트 절차를 재현한다.

currentState:
  branch: main
  completedTc: TC-001 ~ TC-009
  implementedTc: TC-001 ~ TC-009
  executionMode: 하나의 브라우저 페이지와 세션을 사용하는 순차 절차
  nextAction: TC-001 ~ TC-007 전체 절차 재검증

readOrder:
  - tests/test-context/project-context.yml
  - tests/test-cases/qa-test-cases.csv
  - tests/procedures/full-quality-procedure.spec.ts

sources:
  testCases: tests/test-cases/qa-test-cases.csv
  fullProcedure: tests/procedures/full-quality-procedure.spec.ts
  testDataDirectory: tests/test-data
  moduleDirectory: tests/modules
  workLogDirectory: docs/work-log
  changelog: CHANGELOG.md

commands:
  preflight: npm.cmd run preflight
  headlessProcedure: npm.cmd run test:procedure
  visibleProcedure: npm.cmd run test:headed

restartProcedure:
  - 이 파일을 읽고 Git 브랜치와 변경 상태를 확인한다.
  - qa-test-cases.csv와 전체 절차 spec의 TC 순서와 현재 요구사항을 확인한다.
  - 관련 TC의 YAML과 메뉴 모듈을 확인한다.
  - npm.cmd run preflight를 실행한다.
  - 기본 검증은 npm.cmd run test:procedure로 백그라운드 실행한다.
  - 사용자가 명시한 경우에만 npm.cmd run test:headed로 화면을 표시한다.
  - 결과에 따라 이 파일의 currentState와 날짜별 작업일지를 갱신한다.

handoffPrompt: tests/test-context/project-context.yml을 기준으로 프로젝트 상태를 복원하고, preflight 후 현재 등록된 전체 TC를 test:procedure로 백그라운드 실행해. 실패하면 날짜별 로그를 분석하고 결과만 알려줘. UI는 띄우지 마.

invariants:
  - 전체 절차는 하나의 브라우저 페이지와 세션을 사용한다.
  - 로그인은 TC-001에서 한 번만 수행한다.
  - 이후 TC는 이전 TC의 완료 상태를 이어받고 이전 절차를 반복하지 않는다.
  - 메뉴 진입 후 해당 메뉴 영역의 검색 버튼을 한 번 눌러 데이터를 초기 조회한다.
  - 등록·수정 저장 후 목록 반영을 검증하기 전에 해당 메뉴의 검색 버튼을 다시 눌러 목록을 갱신한다.
  - 수집 실행의 최종 결과는 목록 상태와 신규 수집이력 건수 및 최신 수집이력 완료 상태로 확인한다.
  - TC-004 수집 대기 중에는 10초마다 해당 메뉴의 검색 버튼을 눌러 대상 예약 행을 갱신하고 완료 후 신규 수집이력과 최신 완료 상태를 확인한다.
  - 메뉴 콘텐츠 선택자는 가장 가까운 활성 메뉴 영역으로 제한한다.
  - 영역이 제한된 그리드 행의 has 필터 내부 셀은 행 기준 상대 선택자로 작성하고 메뉴 영역을 다시 중첩하지 않는다.
  - 공통 탭 컨테이너에 렌더링되는 화면 탭은 콘텐츠 영역에 강제로 묶지 않고 보이는 탭을 사용한다.
  - 잘못된 선택자가 전체 절차 제한시간까지 대기하지 않도록 유한한 동작·탐색 제한시간을 유지한다.
  - 보이는 하위 메뉴는 바로 클릭하고 숨겨진 경우에만 대메뉴를 펼친다.
  - CSV TC ID와 전체 절차 test.step ID의 구성과 순서는 같아야 한다.
  - 새 TC는 CSV·YAML·메뉴 모듈·개별 spec·전체 절차에 함께 추가한다.
  - TC-007은 TC-006 테이블ID를 정확검색하고 두 체크박스가 저장된 컬럼ID 집합과 조회 컬럼ID 집합을 비교한 뒤 해당 컬럼 전체를 선택해 실행한다.
  - 전체 절차에서 TC-006 실제 테이블ID와 체크 컬럼ID는 테스트 세션 메모리로만 TC-007에 전달하고 파일로 저장하지 않는다.
  - 실제 접속정보가 있는 local YAML은 Git에 커밋하지 않는다.
  - UI 화면은 사용자가 명시적으로 요청한 경우에만 표시한다.
  - 생성된 실패 로그와 실행 메타데이터는 Git에 커밋하지 않는다.
  - 정상 실행과 커밋·푸시 결과는 핵심 결과만 간결하게 보고한다.
  - 실패 분석은 1차 오류 구간부터 확인하고 필요한 경우에만 trace·스크린샷·전체 DOM으로 확장한다.
  - 전체 절차 전에 관련 개별 TC를 우선 검증하고 문서 업데이트는 의미 있는 작업 단위로 묶는다.

  - TC-008 uses the TC-006 column IDs, searches execution history Y, applies a mapping rule inferred from column name and data type, falls back to 숫자완성 테스트, and reruns all target columns.

  - TC-009 registers an incrementally named Column profiling inspection job using the TC-006 table ID, then returns to inspection work management and verifies it by exact job-name search.

  - Column-analysis searches must wait until rows match the requested execution-history state or the scoped empty-result message is visible; a matching table ID alone does not prove the SlickGrid refresh completed.

  - TC-007 searches N first and falls back to Y for the same TC-006 column IDs when a rerun has no unexecuted rows.

  - TC-007 and TC-008 refresh column analysis through the scoped search button every 10 seconds and require every executed TC-006 column ID to have a new execution timestamp and completed job status.

versionPolicy:
  source: package.json
  history: CHANGELOG.md, Git 커밋 및 vX.Y.Z 검증 태그
  releaseRule: 일반 변경은 Git 커밋으로 저장하고 전체 TC 통과 시 공식 버전을 확정해 태그를 생성한다.
  patch: TC 의미가 바뀌지 않는 선택자·대기조건 수정
  minor: 새 TC·메뉴·검사 기능 추가
  major: 전체 절차나 데이터 구조의 호환 불가 변경

runRecords:
  failureLogs: logs/test-errors/YYYY-MM-DD/*.log
  metadata: logs/test-runs/YYYY-MM-DD/*.json
  metadataFields:
    - automationVersion
    - gitCommit
    - status
    - tests
